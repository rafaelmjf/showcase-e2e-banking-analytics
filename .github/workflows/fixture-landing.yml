name: Fixture landing

on:
  workflow_dispatch:
  push:
    paths:
      - "src/banking_analytics/**"
      - "fixtures/**"
      - "config/macro_series_registry.csv"
      - "dbt/**"
      - "orchestration/**"
      - "tests/**"
      - ".github/workflows/fixture-landing.yml"

permissions:
  contents: read

jobs:
  landing:
    name: Load twice and verify PostgreSQL landing
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BANKING_POSTGRES_HOST: localhost
      BANKING_POSTGRES_PORT: "5432"
      BANKING_POSTGRES_DB: banking
      BANKING_POSTGRES_USER: banking
      BANKING_POSTGRES_PASSWORD: banking_local_only
      BANKING_RUN_POSTGRES_TESTS: "1"

    services:
      warehouse:
        image: postgres:18
        env:
          POSTGRES_DB: banking
          POSTGRES_USER: banking
          POSTGRES_PASSWORD: banking_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U banking -d banking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.19"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python and locked project
        run: |
          uv python install 3.12
          uv sync --locked --extra dev

      - name: Verify implementation
        run: |
          uv run --locked ruff check src tests
          uv run --locked pytest

      - name: Load fixture contracts twice
        run: |
          uv run --locked banking-data load-fixtures --project-root .
          uv run --locked banking-data load-fixtures --project-root .

      - name: Verify stable landing identities
        run: >-
          uv run --locked banking-data verify-fixtures
          --output artifacts/generated/fixture_landing_evidence.csv

      - name: Build and test dbt staging and core
        run: >-
          uv run --locked dbt build
          --project-dir dbt
          --profiles-dir dbt

      - name: Validate Dagster definitions
        run: >-
          uv run --locked dagster definitions validate
          -f orchestration/definitions.py
          -a defs

      - name: Materialize fixture asset graph
        run: >-
          uv run --locked dagster job execute
          -f orchestration/definitions.py
          -a defs
          -j fixture_end_to_end

      - name: Preserve verification evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fixture-data-foundation-evidence
          path: |
            artifacts/generated/fixture_landing_evidence.csv
            dbt/target/manifest.json
            dbt/target/run_results.json
          if-no-files-found: error
          retention-days: 30
