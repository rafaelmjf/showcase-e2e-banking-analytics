name: Source availability checkpoint

on:
  workflow_dispatch:
    inputs:
      start_period:
        description: First COSIF bank period (YYYYMM)
        required: true
        default: "202501"
      end_period:
        description: Last COSIF bank period (YYYYMM)
        required: true
        default: "202608"

permissions:
  contents: read

jobs:
  inventory:
    name: Test and probe official COSIF files
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.19"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Install locked project
        run: uv sync --locked --extra dev

      - name: Verify checkpoint implementation
        run: |
          uv run --locked ruff check src tests
          uv run --locked pytest

      - name: Read official source catalog
        id: catalog
        continue-on-error: true
        run: >-
          uv run --locked banking-data source-catalog
          --output artifacts/source_catalog.csv

      - name: Build live source inventory
        id: inventory
        continue-on-error: true
        run: >-
          uv run --locked banking-data source-inventory
          --start "${{ inputs.start_period }}"
          --end "${{ inputs.end_period }}"
          --catalog artifacts/source_catalog.csv
          --output artifacts/source_inventory.csv

      - name: Preserve source evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cosif-source-evidence-${{ inputs.start_period }}-${{ inputs.end_period }}
          path: artifacts/source_*.csv
          if-no-files-found: error
          retention-days: 30

      - name: Enforce checkpoint exit gate
        if: always()
        run: |
          test "${{ steps.catalog.outcome }}" = "success"
