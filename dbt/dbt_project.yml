name: banking_analytics
version: 1.0.0
config-version: 2

profile: banking_analytics

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  banking_analytics:
    +materialized: table
    staging:
      +schema: staging
      +tags: ["fixture_ready", "staging"]
    core:
      +schema: core
      +tags: ["fixture_ready", "core"]
    marts:
      +schema: marts
      +tags: ["fixture_ready", "marts"]

seeds:
  banking_analytics:
    +schema: governance
    reporting_line_mapping_seed:
      +column_types:
        account_code: text
        reporting_line_key: text
        mapping_version: text
    top15_population_seed:
      +column_types:
        freeze_period: text
        institution_cnpj: text
