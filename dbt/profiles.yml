banking_analytics:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('BANKING_POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('BANKING_POSTGRES_PORT', '55433') | int }}"
      dbname: "{{ env_var('BANKING_POSTGRES_DB', 'banking') }}"
      user: "{{ env_var('BANKING_POSTGRES_USER', 'banking') }}"
      password: "{{ env_var('BANKING_POSTGRES_PASSWORD', 'banking_local_only') }}"
      schema: analytics
      threads: 4
      connect_timeout: 10
